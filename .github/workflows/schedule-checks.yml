name: Schedule app checks
on:
  push:
    branches:
      - feature/staff-search-quick-edit
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package*.json"
      - ".github/workflows/schedule-checks.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
